workflows:
  ios-app-store:
    name: Ahmed iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    integrations:
      app_store_connect: Ahmed
    environment:
      vars:
        BUNDLE_ID: com.darraha.ahmed
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 6810042737
        APP_STORE_CONNECT_ISSUER_ID: c46c0b74-7d00-42b2-9786-333b76dacf91
        APP_STORE_CONNECT_KEY_IDENTIFIER: 8LM6C7D787
      xcode: latest
      node: 22
      cocoapods: default
    scripts:
      - name: Check App Store Connect credentials
        script: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo "App Store Connect .p8 is missing in this build."
            echo "Codemagic → Team integrations → Developer Portal: key name must be exactly: ahmed"
            echo "Or add secret APP_STORE_CONNECT_PRIVATE_KEY on the Ahmed app."
            exit 1
          fi
          echo "Issuer: ${APP_STORE_CONNECT_ISSUER_ID:-missing}"
          echo "Key ID: ${APP_STORE_CONNECT_KEY_IDENTIFIER:-missing}"
          echo "Private key: present"
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$HOME/private_keys"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].replace("\\n", "\n").strip()
          if "BEGIN" not in raw:
              raise SystemExit("APP_STORE_CONNECT_PRIVATE_KEY is not a PEM .p8 key")
          text = raw + "\n"
          kid = os.environ.get("APP_STORE_CONNECT_KEY_IDENTIFIER", "8LM6C7D787")
          for folder in (
              Path.home() / ".appstoreconnect/private_keys",
              Path.home() / "private_keys",
              Path("private_keys"),
          ):
              folder.mkdir(parents=True, exist_ok=True)
              path = folder / f"AuthKey_{kid}.p8"
              path.write_text(text)
              path.chmod(0o600)
              print(f"wrote {path}")
          PY
      - name: Install JS
        script: |
          npm ci
          npx prisma generate
      - name: Native web + Capacitor iOS
        script: |
          npm run build:native
          cd ios/App
          pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id @env:APP_STORE_CONNECT_ISSUER_ID \
            --key-id @env:APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          BUILD_NUMBER="${CM_BUILD_NUMBER:-$(date +%Y%m%d%H%M)}"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" \
            --issuer-id @env:APP_STORE_CONNECT_ISSUER_ID \
            --key-id @env:APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            BUILD_NUMBER=$((LATEST + 1))
          fi
          agvtool new-version -all "$BUILD_NUMBER" || true
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: 8LM6C7D787
        issuer_id: c46c0b74-7d00-42b2-9786-333b76dacf91
        submit_to_testflight: true

  android-internal:
    name: Ahmed Android
    instance_type: linux
    max_build_duration: 60
    environment:
      java: 17
      node: 22
    scripts:
      - name: Install
        script: |
          npm ci
          npx prisma generate
          npm run build:native
      - name: Assemble debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
