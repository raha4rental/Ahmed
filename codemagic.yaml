workflows:
  android-internal:
    name: Ahmed Android
    instance_type: linux
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      java: 17
      node: 22
    scripts:
      - name: Install
        script: |
          npm ci
          npx prisma generate
          npm run build:native
      - name: Assemble debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  ios-app-store:
    name: Ahmed iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Ahmed
    environment:
      ios_signing:
        bundle_identifier: com.ahmed.app
      vars:
        XCODE_SCHEME: App
      node: 22
      cocoapods: default
    scripts:
      - name: Install JS
        script: |
          npm ci
          npx prisma generate
      - name: Native web + Capacitor iOS
        script: |
          npm run build:native
          cd ios/App
          pod install
      - name: Build ipa
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
