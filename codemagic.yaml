workflows:
  ios-app-store:
    name: Ahmed iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    integrations:
      app_store_connect: Ahmed
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ahmed.app
      vars:
        BUNDLE_ID: com.ahmed.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      xcode: latest
      node: 22
      cocoapods: default
    scripts:
      - name: Install JS
        script: |
          npm ci
          npx prisma generate
      - name: Native web + Capacitor iOS
        script: |
          npm run build:native
          cd ios/App
          pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          BUILD_NUMBER="${CM_BUILD_NUMBER:-$(date +%Y%m%d%H%M)}"
          agvtool new-version -all "$BUILD_NUMBER" || true
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-internal:
    name: Ahmed Android
    instance_type: linux
    max_build_duration: 60
    environment:
      java: 17
      node: 22
    scripts:
      - name: Install
        script: |
          npm ci
          npx prisma generate
          npm run build:native
      - name: Assemble debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
