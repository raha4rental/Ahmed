workflows:
  ios-app-store:
    name: Ahmed iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      vars:
        APP_NAME: Ahmed
        APP_STORE_NAME: السعدي
        BUNDLE_ID: com.darraha.ahmed
        TEAM_ID: VPT9SWM94A
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 6810042737
        APP_STORE_CONNECT_ISSUER_ID: c46c0b74-7d00-42b2-9786-333b76dacf91
        APP_STORE_CONNECT_KEY_IDENTIFIER: 8LM6C7D787
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgx3Kgw+wjiw+ggpwD
          jHTD0JP8nn9kZkkjRtWHZjEwClGgCgYIKoZIzj0DAQehRANCAAQITQi7zs3SXHpw
          kDjfivCi6P70i1B6WybOKLms/7AKUaCP/Woz8zlQy0L0bPQ2ePwclx9VBOs2kaY+
          +Pq7ZPOu
          -----END PRIVATE KEY-----
        APP_STORE_PROFILE_NAME: Ahmed App Store Codemagic
        APP_STORE_PROFILE_ID: S9V76LJWYB
        APP_STORE_PROFILE_UUID: 93a6a9a2-d293-4e98-98c2-7aa74b08d3a7
        DISTRIBUTION_CERTIFICATE_ID: JRU86YL2BU
      xcode: latest
      node: 22
      cocoapods: default
    scripts:
      - name: Link App Store Connect
        script: |
          set -euo pipefail
          python3 scripts/normalize-asc-key.py
          KEY_ID="${APP_STORE_CONNECT_KEY_IDENTIFIER:-}"
          KEY_FILE="${APP_STORE_CONNECT_PRIVATE_KEY_FILE:-$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8}"
          if [ ! -f "$KEY_FILE" ]; then
            echo "Normalized .p8 was not written to $KEY_FILE"
            exit 1
          fi
          echo "Using $KEY_FILE"
      - name: Install JS
        script: |
          npm ci
          npx prisma generate
      - name: Native web + Capacitor iOS
        script: |
          npm run build:native
          cd ios/App
          pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Import Apple Distribution identity
        script: |
          set -euo pipefail
          bash "$CM_BUILD_DIR/scripts/ci/import-ios-signing.sh"
      - name: Set up code signing
        script: |
          set -euo pipefail
          xcode-project use-profiles
      - name: Increment build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios/App"
          BUILD_NUMBER="${CM_BUILD_NUMBER:-$(date +%Y%m%d%H%M)}"
          KEY_FILE="${APP_STORE_CONNECT_PRIVATE_KEY_FILE:-$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8}"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@file:$KEY_FILE" \
            2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            BUILD_NUMBER=$((LATEST + 1))
          fi
          agvtool new-version -all "$BUILD_NUMBER" || true
      - name: Build ipa
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "$CM_BUILD_DIR/ios/ExportOptions.plist" \
            || {
              echo "IPA build failed. Last xcodebuild log:"
              ls -lt /tmp/xcodebuild_logs 2>/dev/null || true
              tail -n 200 /tmp/xcodebuild_logs/*.log 2>/dev/null || true
              exit 65
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: AFTER_APPROVAL
        copyright: 2026 Ahmed Al Saadi Real Estate & Investments
